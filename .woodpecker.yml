when:
  - event: manual
  - event: push
    branch: master

steps:
  - name: build-and-push
    image: plugins/docker
    settings:
      repo: 172.17.1.130:3000/phenomics/phenomics-agent-frontend
      tags:
        - ${CI_BUILD_NUMBER}
        - ${CI_COMMIT_SHA}
      registry: 172.17.1.130:3000
      username:
        from_secret: gitea_registry_user
      password:
        from_secret: gitea_registry_token
      dockerfile: Dockerfile
      context: .

  - name: deploy
    image: docker
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - cd /home/root01/phenomics-agent
      - docker compose pull phenomics-frontend
      - docker compose up -d phenomics-frontend
      - docker image prune -f

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock
