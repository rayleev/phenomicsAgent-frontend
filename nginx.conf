server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：所有非静态资源路由回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到无人机影像服务 (droneImaging)
    location /api/drone/ {
        proxy_pass http://drone-imaging:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 支持大文件上传
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }

    # 反向代理到后端 API
    location /api/ {
        proxy_pass http://phenomics-backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
